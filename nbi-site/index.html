// ============================================================
// ENGINE
// ============================================================
let lang = 'ja';

function t(k) { return T[lang][k] ?? T.ja[k] ?? k; }

function applyAll() {
  // Static text
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (v !== undefined) el.innerHTML = v;
  });
  // Placeholders
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });

  // Pricing list
  const pl = document.getElementById('pricing-list');
  pl.innerHTML = T[lang]._pricing_includes.map(s =>
    `<li class="flex gap-2 items-start"><span class="text-green-500 mt-0.5 flex-shrink-0">✓</span><span>${s}</span></li>`
  ).join('');

  // Steps
  const sc = document.getElementById('process-steps');
  sc.innerHTML = T[lang]._steps.map((s, i) => `
    <div class="flex gap-4 items-start bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
      <div class="step-num">${i + 1}</div>
      <div>
        <h3 class="font-bold text-gray-900 mb-1">${s.t}</h3>
        <p class="text-gray-500 text-sm leading-relaxed">${s.b}</p>
      </div>
    </div>
  `).join('');

  // FAQ
  const fc = document.getElementById('faq-list');
  fc.innerHTML = T[lang]._faqs.map(f => `
    <details class="faq bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
      <summary class="flex justify-between items-center p-5 gap-4 select-none">
        <span class="font-semibold text-gray-900 text-sm sm:text-base">${f.q}</span>
        <svg class="chevron w-5 h-5 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="px-5 pb-5 pt-4 text-gray-600 text-sm leading-relaxed border-t border-gray-100">${f.a}</div>
    </details>
  `).join('');

  // form _subject hidden field language
  const subj = document.querySelector('input[name="_subject"]');
  if (subj) subj.value = lang === 'ja' ? 'NBIサポートサイトからのお問い合わせ' : 'Inquiry from NBI Support site';
}

function toggleLang() {
  lang = lang === 'ja' ? 'en' : 'ja';
  document.getElementById('lang-btn').textContent = lang === 'ja' ? '🌐 English' : '🌐 日本語';
  document.documentElement.lang = lang;
  applyAll();
}

document.addEventListener('DOMContentLoaded', applyAll);
</script>
