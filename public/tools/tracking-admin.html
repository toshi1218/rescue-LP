<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>進捗管理（スタッフ用）｜ph-document.com</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#22304a; --muted:#64748b; --line:#e3e8f0;
    --navy:#1a365d; --gold:#e8b64a; --green:#16a34a; --red:#dc2626;
    --field:#ffffff; --field-line:#cdd6e3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1626; --panel:#16203a; --ink:#e6ecf7; --muted:#93a3bd; --line:#26324e;
           --field:#111a30; --field-line:#31415f; }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;padding:20px;}
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-size:19px;font-weight:800;margin-bottom:4px;}
  h1 em{color:var(--gold);font-style:normal;}
  p.sub{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  input,select,textarea{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:14px;margin-bottom:12px;}
  button{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  button.gold{background:var(--gold);color:#1a2540;}
  button:disabled{opacity:.55;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row>div{flex:1;min-width:150px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .code{font-family:ui-monospace,Menlo,monospace;font-weight:700;}
  .pill{display:inline-block;background:var(--gold);color:#1a2540;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;}
  .muted{color:var(--muted);}
  .ok{color:var(--green);font-weight:700;}
  .err{color:var(--red);font-weight:700;}
  .file{font-size:13px;padding:4px 0;}
  a.dl{color:var(--navy);text-decoration:underline;}
  @media (prefers-color-scheme: dark){ a.dl{color:#8fb3e8;} }
  hr{border:0;border-top:1px solid var(--line);margin:14px 0;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>進捗管理 <em>スタッフ用</em></h1>
  <p class="sub">お客様の追跡番号を発行し、進捗ステータスとアップロード書類を管理します。（このページは検索非掲載）</p>

  <div class="panel" id="loginPanel">
    <label>API URL</label>
    <input id="apiUrl" value="https://tracking.ph-document.com" />
    <label>管理パスワード（ADMIN_PASSWORD）</label>
    <input id="adminPw" type="password" placeholder="wrangler secret put で設定した値" />
    <button id="loginBtn" class="gold">ログイン</button>
    <span id="loginMsg" class="muted" style="margin-left:10px;"></span>
  </div>

  <div id="app" class="hidden">
    <div class="panel">
      <div class="row">
        <div>
          <label>新規発行（お客様名・任意）</label>
          <input id="newName" placeholder="山田 太郎" />
        </div>
        <div style="flex:0 0 auto;">
          <button id="createBtn" class="gold">追跡番号を発行</button>
        </div>
      </div>
      <div id="createResult"></div>
    </div>

    <div class="panel">
      <div class="row" style="margin-bottom:10px;">
        <strong style="font-size:14px;">依頼一覧</strong>
        <button id="refreshBtn" style="flex:0 0 auto;padding:6px 12px;">更新</button>
      </div>
      <div id="listWrap"><p class="muted">読み込み中…</p></div>
    </div>

    <div class="panel hidden" id="detailPanel">
      <div class="row" style="margin-bottom:6px;">
        <strong style="font-size:14px;">詳細: <span class="code" id="detailCode"></span></strong>
        <button id="closeDetail" style="flex:0 0 auto;padding:6px 12px;background:#64748b;">閉じる</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>
</div>

<script>
const STAGES = [
  ['received','申込受付'],['applying','申請中（PSA/NBI等）'],['approved','受理済み'],
  ['apostille','アポスティーユ処理中'],['preparing_shipment','発送準備中'],
  ['in_transit','フィリピンから配送中'],['delivered','お届け完了'],
];
let API = '', PW = '';
const $ = (id) => document.getElementById(id);
function fmt(ts){ return new Date(ts).toLocaleString('ja-JP'); }
async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+PW, ...(opts.headers||{}) },
  });
  return res;
}

$('loginBtn').onclick = async () => {
  API = $('apiUrl').value.replace(/\/$/,''); PW = $('adminPw').value;
  $('loginMsg').textContent = '確認中…';
  const res = await api('/api/admin/list');
  if (res.status === 401){ $('loginMsg').innerHTML = '<span class="err">パスワードが違います</span>'; return; }
  if (!res.ok){ $('loginMsg').innerHTML = '<span class="err">接続エラー</span>'; return; }
  $('loginPanel').classList.add('hidden'); $('app').classList.remove('hidden');
  renderList(await res.json());
};

const SITE = 'https://ph-document.com';
function portalUrl(lang, code, pin){
  return SITE + '/' + lang + '/tracking/?code=' + encodeURIComponent(code) + '&pin=' + encodeURIComponent(pin);
}
function messageTemplate(lang, url){
  if (lang === 'en') return 'You can check the progress of your order and upload documents here:\n' + url + '\n\n(This link contains your access code — please do not share it.)';
  if (lang === 'ko') return '진행 상황 확인 및 서류 업로드는 아래 링크에서 하실 수 있습니다:\n' + url + '\n\n(이 링크에는 접속 정보가 포함되어 있으니 공유하지 마세요.)';
  return 'ご依頼の進捗確認と書類のアップロードは、こちらのリンクからお願いいたします。\n' + url + '\n\n※このリンクにはお客様専用のアクセス情報が含まれています。第三者に共有しないでください。';
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch { const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const label = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(()=>{ btn.textContent = label; }, 1500);
}

$('createBtn').onclick = async () => {
  const res = await api('/api/admin/create', { method:'POST', body: JSON.stringify({ customer_name: $('newName').value || null }) });
  if (!res.ok){ $('createResult').innerHTML = '<p class="err">発行に失敗しました</p>'; return; }
  const { code, pin } = await res.json();
  $('createResult').innerHTML =
    '<hr><p>発行しました。<strong>下のリンクをそのままお客様に送れば</strong>、入力なしで進捗確認と書類アップロードができます。</p>'+
    '<label style="margin-top:10px;">お客様の言語</label>'+
    '<select id="urlLang"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select>'+
    '<label>送付リンク</label>'+
    '<input id="sendUrl" readonly value="'+portalUrl('ja', code, pin)+'" />'+
    '<button id="copyUrl" class="gold">リンクをコピー</button> '+
    '<button id="copyMsg" style="background:#475569;">案内文ごとコピー</button>'+
    '<p class="muted" style="margin-top:10px;">追跡番号: <span class="code">'+code+'</span> ／ PIN: <span class="code">'+pin+'</span>'+
    '（お客様が手入力する場合は '+SITE+'/ja/tracking/ でこの2つを入力）</p>';

  const sync = () => { $('sendUrl').value = portalUrl($('urlLang').value, code, pin); };
  $('urlLang').onchange = sync;
  $('copyUrl').onclick = () => copyText($('sendUrl').value, $('copyUrl'));
  $('copyMsg').onclick = () => copyText(messageTemplate($('urlLang').value, $('sendUrl').value), $('copyMsg'));

  $('newName').value=''; refresh();
};

$('refreshBtn').onclick = refresh;
async function refresh(){ const res = await api('/api/admin/list'); if(res.ok) renderList(await res.json()); }

function renderList(data){
  const rows = (data.trackings||[]).map(t => {
    const label = (STAGES.find(s=>s[0]===t.current_status)||['','?'])[1];
    return '<tr><td class="code">'+t.code+'</td><td>'+(t.customer_name||'<span class="muted">—</span>')+
      '</td><td><span class="pill">'+label+'</span></td><td class="muted">'+fmt(t.status_updated_at)+
      '</td><td><button data-code="'+t.code+'" class="openBtn" style="padding:5px 10px;">開く</button></td></tr>';
  }).join('');
  $('listWrap').innerHTML = rows
    ? '<table><thead><tr><th>追跡番号</th><th>お客様</th><th>現在</th><th>最終更新</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
    : '<p class="muted">まだ依頼がありません。</p>';
  document.querySelectorAll('.openBtn').forEach(b => b.onclick = () => openDetail(b.dataset.code));
}

async function openDetail(code){
  const res = await api('/api/admin/detail/'+code);
  if(!res.ok) return;
  const d = await res.json();
  $('detailCode').textContent = code;
  const options = STAGES.map(s => '<option value="'+s[0]+'"'+(s[0]===d.tracking.current_status?' selected':'')+'>'+s[1]+'</option>').join('');
  const files = (d.uploads||[]).length
    ? d.uploads.map(u => '<div class="file">📎 <a class="dl" href="#" data-id="'+u.id+'">'+u.filename+'</a> <span class="muted">('+fmt(u.uploaded_at)+')</span></div>').join('')
    : '<p class="muted">アップロードされた書類はありません。</p>';
  $('detailBody').innerHTML =
    '<hr><label>お客様への送付リンク（再送用）</label>'+
    '<select id="dLang"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select>'+
    '<input id="dUrl" readonly value="'+portalUrl('ja', code, d.tracking.pin)+'" />'+
    '<button id="dCopy" style="background:#475569;">リンクをコピー</button>'+
    '<hr><label>ステータス更新</label><select id="stSel">'+options+'</select>'+
    '<label>メモ（任意・お客様に表示されます）</label><textarea id="stNote" rows="2">'+(d.tracking.status_note||'')+'</textarea>'+
    '<button id="saveSt" class="gold">更新して保存</button> <span id="saveMsg" class="muted"></span>'+
    '<hr><label>アップロード書類</label>'+files;
  $('detailPanel').classList.remove('hidden');
  $('dLang').onchange = () => { $('dUrl').value = portalUrl($('dLang').value, code, d.tracking.pin); };
  $('dCopy').onclick = () => copyText($('dUrl').value, $('dCopy'));
  $('saveSt').onclick = async () => {
    const r = await api('/api/admin/status', { method:'POST', body: JSON.stringify({ code, status: $('stSel').value, note: $('stNote').value }) });
    $('saveMsg').innerHTML = r.ok ? '<span class="ok">保存しました</span>' : '<span class="err">失敗</span>';
    if(r.ok) refresh();
  };
  document.querySelectorAll('#detailBody a.dl').forEach(a => a.onclick = async (e) => {
    e.preventDefault();
    const res = await api('/api/admin/download/'+code+'/'+a.dataset.id);
    if(!res.ok){ alert('ダウンロード失敗'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href=url; link.download=a.textContent; link.click();
    URL.revokeObjectURL(url);
  });
}
$('closeDetail').onclick = () => $('detailPanel').classList.add('hidden');
</script>
</body>
</html>
