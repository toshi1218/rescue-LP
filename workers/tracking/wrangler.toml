name = "ph-document-tracking"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# tracking.ph-document.com をこのWorkerに紐付ける（DNSレコードも wrangler が作成）。
# ph-document.com のゾーンが同じCloudflareアカウントにある前提。別アカウントの場合は
# この3行をコメントアウトし、ダッシュボードから手動でカスタムドメインを追加する。
routes = [
  { pattern = "tracking.ph-document.com", custom_domain = true },
  # ブラウザからのAPI通信は本体ドメインに集約する。Cloudflare Accessは
  # ph-document.com/api/admin/* のみを保護し、顧客用APIは code + PIN のまま。
  { pattern = "ph-document.com/api/*", zone_name = "ph-document.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "ph-document-tracking"
database_id = "313a6464-9358-4eba-bcc7-f9b5222a62b8"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ph-document-tracking-uploads"

[triggers]
crons = ["0 3 * * *"]

# Secrets (set via `wrangler secret put` and verified by the deploy workflow):
#   ADMIN_PASSWORD          -- second factor for the staff admin tool
#   CF_ACCESS_TEAM_DOMAIN   -- Zero Trust team domain (example.cloudflareaccess.com)
#   CF_ACCESS_AUD           -- Access application audience for /api/admin/*
#   ADMIN_ALLOWED_EMAIL     -- only permitted staff email address

[vars]
ALLOWED_ORIGIN = "https://ph-document.com"
