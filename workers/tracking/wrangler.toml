name = "ph-document-tracking"
main = "src/main.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "tracking.ph-document.com", custom_domain = true },
  { pattern = "ph-document.com/api/*", zone_name = "ph-document.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "ph-document-tracking"
database_id = "313a6464-9358-4eba-bcc7-f9b5222a62b8"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ph-document-tracking-uploads"

[triggers]
crons = ["0 3 * * *"]

[vars]
ALLOWED_ORIGIN = "https://ph-document.com"
WHATSAPP_GRAPH_VERSION = "v23.0"

# Existing Worker secrets:
#   ADMIN_PASSWORD, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, ADMIN_ALLOWED_EMAIL
# CRM secrets:
#   CRM_INGEST_SECRET
#   WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET, WHATSAPP_ACCESS_TOKEN,
#   WHATSAPP_PHONE_NUMBER_ID
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN
