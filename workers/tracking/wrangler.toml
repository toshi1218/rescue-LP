name = "ph-document-tracking"
main = "src/main.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# tracking.ph-document.com をこのWorkerに紐付ける（DNSレコードも wrangler が作成）。
routes = [
  { pattern = "tracking.ph-document.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "ph-document-tracking"
database_id = "REPLACE_WITH_D1_ID_AFTER_CREATE"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ph-document-tracking-uploads"

triggers = { crons = ["0 3 * * *"] }

# Secrets (set via `wrangler secret put`):
#   ADMIN_PASSWORD              -- staff admin tool
#   CRM_INGEST_SECRET           -- Gmail bridge / sheet sync / send API
#   WHATSAPP_VERIFY_TOKEN       -- Meta webhook verification
#   WHATSAPP_APP_SECRET         -- Meta webhook signature verification
#   WHATSAPP_ACCESS_TOKEN       -- outbound WhatsApp API
#   WHATSAPP_PHONE_NUMBER_ID    -- outbound WhatsApp API
#   LINE_CHANNEL_SECRET         -- LINE webhook signature verification
#   LINE_CHANNEL_ACCESS_TOKEN   -- LINE profile lookup + outbound API
#
# Vars:
#   WHATSAPP_GRAPH_VERSION      -- set to the Meta Graph API version configured for the account

[vars]
ALLOWED_ORIGIN = "https://ph-document.com"
WHATSAPP_GRAPH_VERSION = "v23.0"
