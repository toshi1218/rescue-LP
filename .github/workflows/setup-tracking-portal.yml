name: Set up document tracking portal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRACKING_ADMIN_PASSWORD: ${{ secrets.TRACKING_ADMIN_PASSWORD }}
    defaults:
      run:
        working-directory: workers/tracking
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/tracking/package-lock.json

      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TRACKING_ADMIN_PASSWORD"

      - name: Install Worker dependencies
        run: npm ci

      - name: Create storage resources
        id: resources
        run: |
          d1_json="$(npx wrangler d1 create ph-document-tracking --json)"
          d1_id="$(printf '%s' "$d1_json" | jq -r '.uuid // .database_id // empty')"
          test -n "$d1_id"

          npx wrangler r2 bucket create ph-document-tracking-uploads

          kv_json="$(npx wrangler kv namespace create RATE_LIMIT --json)"
          kv_id="$(printf '%s' "$kv_json" | jq -r '.id // empty')"
          test -n "$kv_id"

          {
            echo "d1_id=$d1_id"
            echo "kv_id=$kv_id"
          } >> "$GITHUB_OUTPUT"

      - name: Create deployment configuration
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
          KV_ID: ${{ steps.resources.outputs.kv_id }}
        run: |
          cat > wrangler.mobile.toml <<EOF
          name = "ph-document-tracking"
          main = "src/index.ts"
          compatibility_date = "2026-04-01"
          compatibility_flags = ["nodejs_compat"]
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          routes = [
            { pattern = "tracking.ph-document.com", custom_domain = true }
          ]

          [[d1_databases]]
          binding = "DB"
          database_name = "ph-document-tracking"
          database_id = "$D1_ID"

          [[r2_buckets]]
          binding = "UPLOADS"
          bucket_name = "ph-document-tracking-uploads"

          [[kv_namespaces]]
          binding = "RATE_LIMIT"
          id = "$KV_ID"

          [vars]
          ALLOWED_ORIGIN = "https://ph-document.com"
          EOF

      - name: Apply database schema
        run: npx wrangler d1 execute ph-document-tracking --file=./schema.sql --remote --config=wrangler.mobile.toml

      - name: Set admin password
        run: printf '%s' "$TRACKING_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config=wrangler.mobile.toml

      - name: Deploy tracking Worker
        run: npx wrangler deploy --config=wrangler.mobile.toml
