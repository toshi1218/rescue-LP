name: GSC Daily Monitor

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 09:00 JST (UTC 00:00)
  workflow_dispatch:       # 手動実行も可能

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Run GSC monitor
        id: monitor
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/gsc_monitor.py
        continue-on-error: true

      - name: Send email alert
        if: steps.monitor.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          subject: '🚨 ph-document.com GSCアラート'
          body: ${{ steps.monitor.outputs.report }}
