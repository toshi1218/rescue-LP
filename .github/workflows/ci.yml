name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SEO lint
        run: npm run lint:seo

      - name: Type check (informational)
        run: npm run typecheck || echo "::warning::Type errors found — run npm run typecheck locally to see details"

      - name: ESLint (informational)
        run: npm run lint || echo "::warning::Lint errors found — run npm run lint locally to see details"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
