name: Block Codex Auto PRs

on:
  pull_request:
    types: [opened, reopened]

jobs:
  block-codex-prs:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'codex/')
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🤖 このPRはChatGPT Codexが自動作成しました。リポジトリポリシーにより自動クローズします。\n\nCodexの自動PR作成を完全に停止するには [Codex設定](https://chatgpt.com/codex/cloud/settings/general) でBackground tasksを無効化してください。'
            });
